<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Painel de Projetos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --border: #2a2a3a;
    --accent1: #4f8ef7;
    --accent2: #a259ff;
    --accent3: #00d4aa;
    --accent4: #ff6b6b;
    --text: #e8e8f0;
    --muted: #888898;
    --card-bg: #16161f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .topbar h1 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 0%, var(--accent1) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .topbar-actions { display: flex; gap: 8px; }

  .btn-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn-icon:active { transform: scale(0.92); background: var(--border); }
  .btn-icon.active {
    background: rgba(255,107,107,0.15);
    border-color: var(--accent4);
  }
  .btn-icon.sort-flash {
    background: rgba(79,142,247,0.2);
    border-color: var(--accent1);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 20px 16px;
  }

  /* PROJECT BOX */
  .project-box {
    background: var(--card-bg);
    border-radius: 18px;
    border: 1.5px solid var(--border);
    padding: 16px;
    position: relative;
    overflow: visible;
    transition: border-color 0.2s, transform 0.15s, opacity 0.2s, box-shadow 0.2s;
  }

  .project-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    border-radius: 18px 18px 0 0;
    pointer-events: none;
  }

  /* Drag states */
  .project-box.is-dragging-src {
    opacity: 0.35;
    transform: scale(0.97);
    border-color: var(--accent1);
  }

  .project-box.is-drag-over {
    border-color: var(--accent1);
    box-shadow: 0 0 0 2px var(--accent1);
    transform: scale(1.03);
  }

  .project-box.drag-floating {
    position: fixed;
    z-index: 999;
    opacity: 0.96;
    box-shadow: 0 24px 60px rgba(0,0,0,0.75);
    transform: scale(1.06) rotate(1.5deg);
    border-color: var(--accent1);
    pointer-events: none;
    transition: none !important;
    overflow: hidden;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* DRAG HANDLE — only visible in edit mode */
  .drag-handle {
    display: none;
    position: absolute;
    top: 10px; right: 10px;
    width: 28px; height: 28px;
    align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 18px;
    cursor: grab;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    z-index: 10;
    touch-action: none;
    line-height: 1;
  }
  .project-box.editing .drag-handle { display: flex; }

  @keyframes wiggle {
    from { transform: rotate(-5deg); }
    to   { transform: rotate(5deg); }
  }
  .project-box.editing .drag-handle { animation: wiggle 0.55s infinite alternate; }

  /* PROJECT HEADER */
  .project-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-right: 2px;
  }

  .project-name {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.2px;
    flex: 1;
    cursor: pointer;
  }

  .project-header-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .project-count {
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .delete-project-btn {
    display: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent4);
    color: #fff;
    font-size: 11px;
    align-items: center; justify-content: center;
    cursor: pointer;
    font-weight: 700;
    border: none;
    flex-shrink: 0;
  }
  .project-box.editing .delete-project-btn { display: flex; }

  /* SHORTCUTS */
  .shortcuts {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    padding: 6px 2px;
    border-radius: 12px;
    transition: background 0.15s;
    text-decoration: none;
  }
  .shortcut:active { background: var(--border); }

  .shortcut-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    position: relative;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .shortcut:active .shortcut-icon {
    transform: scale(0.88);
    box-shadow: 0 0 0 2px var(--accent);
  }

  .shortcut-label {
    font-size: 9px;
    color: var(--muted);
    text-align: center;
    max-width: 50px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .shortcut-add .shortcut-icon {
    border: 1.5px dashed var(--border);
    background: transparent;
    font-size: 20px;
    color: var(--muted);
  }

  /* Edit: wiggle shortcut icons */
  .project-box.editing .shortcut:not(.shortcut-add) .shortcut-icon {
    animation: wiggle 0.5s infinite alternate;
  }

  .delete-btn {
    display: none;
    position: absolute;
    top: -5px; right: -5px;
    width: 17px; height: 17px;
    background: var(--accent4);
    border-radius: 50%;
    font-size: 10px;
    align-items: center; justify-content: center;
    color: #fff;
    font-weight: 700;
    z-index: 10;
    cursor: pointer;
    border: none;
    line-height: 1;
  }
  .project-box.editing .shortcut:not(.shortcut-add) .delete-btn { display: flex; }

  .empty-hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 10px 0 4px;
    opacity: 0.7;
    grid-column: 1/-1;
  }

  /* DRAG HINT BAR */
  .drag-hint {
    display: none;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 4px 16px 0;
    opacity: 0.75;
  }
  body.editing-mode .drag-hint { display: block; }

  /* MODAL */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 200;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    border-top: 1px solid var(--border);
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal h3 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--text);
  }

  .modal-field { margin-bottom: 14px; }

  .modal-field label {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .modal-field input {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal-field input:focus { border-color: var(--accent1); }

  .emoji-picker {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-top: 6px;
  }

  .emoji-opt {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--card-bg);
    border: 1.5px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .emoji-opt.selected { border-color: var(--accent1); background: rgba(79,142,247,0.15); }
  .emoji-opt:active { transform: scale(0.9); }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
  }
  .btn:active { opacity: 0.8; transform: scale(0.97); }
  .btn-primary { background: var(--accent1); color: #fff; }
  .btn-ghost   { background: var(--border); color: var(--text); }

  .add-project-btn {
    margin: 0 16px 28px;
    padding: 14px;
    border-radius: 16px;
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    width: calc(100% - 32px);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .add-project-btn:active { background: var(--surface); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 72px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.28s ease;
    pointer-events: none;
    white-space: nowrap;
    z-index: 300;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <h1>⚡ Meus Projetos</h1>
  <div class="topbar-actions">
    <button class="btn-icon" id="sortBtn" onclick="sortAlpha()" title="Ordenar A–Z">🔤</button>
    <button class="btn-icon" id="editToggle" onclick="toggleEditMode()" title="Editar / mover">✏️</button>
    <button class="btn-icon" onclick="showAddProject()" title="Novo projeto">＋</button>
  </div>
</div>

<div class="drag-hint">☰ Segure o ícone ⠿ e arraste para reordenar</div>

<div class="grid" id="projectGrid"></div>

<button class="add-project-btn" onclick="showAddProject()">＋ Novo Projeto</button>

<div class="toast" id="toast"></div>

<!-- Modal: novo atalho -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal">
    <h3>Novo Atalho</h3>
    <div class="modal-field">
      <label>Nome</label>
      <input type="text" id="scName" placeholder="Ex: Drive, Notion, Site...">
    </div>
    <div class="modal-field">
      <label>Link (URL)</label>
      <input type="url" id="scUrl" placeholder="https://...">
    </div>
    <div class="modal-field">
      <label>Ícone</label>
      <div class="emoji-picker" id="emojiPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveShortcut()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: novo projeto -->
<div class="modal-backdrop" id="projModalBackdrop" onclick="closeProjModal(event)">
  <div class="modal">
    <h3>Novo Projeto</h3>
    <div class="modal-field">
      <label>Nome do Projeto</label>
      <input type="text" id="projName" placeholder="Ex: Marketing, Obras, Financeiro...">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeProjModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProject()">Criar</button>
    </div>
  </div>
</div>

<script>
const EMOJIS = ['📄','📁','🌐','📊','📝','📌','🔗','💼','📅','🖼️','📧','💬','🎯','📦','🔧','⚙️','📱','💻','🗂️','🏗️','📐','📋','🧾','💡','🔐','📤','📥','🎨','🎬','🎵','📸','🧩','🗺️','📞','🔍','✅'];
const ACCENTS = ['#4f8ef7','#a259ff','#00d4aa','#ff6b6b','#f7a825','#25d4f7'];

let projects = JSON.parse(localStorage.getItem('painelProjects') || 'null') || [
  { id:1, name:'Projeto 1', color:'#4f8ef7', shortcuts:[
    { id:1, name:'Drive', url:'https://drive.google.com', icon:'📁' },
    { id:2, name:'Docs',  url:'https://docs.google.com',  icon:'📄' },
    { id:3, name:'Meet',  url:'https://meet.google.com',  icon:'💬' },
  ]},
  { id:2, name:'Projeto 2', color:'#a259ff', shortcuts:[] },
  { id:3, name:'Projeto 3', color:'#00d4aa', shortcuts:[] },
  { id:4, name:'Projeto 4', color:'#ff6b6b', shortcuts:[] },
];

let editMode        = false;
let currentProjId   = null;
let selectedEmoji   = '🔗';
let nextId          = 200;

// ─── DRAG STATE ───────────────────────────────────────────
let dragSrcId   = null;
let floatEl     = null;
let dragOffX    = 0, dragOffY = 0;
let overProjId  = null;

// ─── PERSIST ──────────────────────────────────────────────
function save() { localStorage.setItem('painelProjects', JSON.stringify(projects)); }

// ─── RENDER ───────────────────────────────────────────────
function renderAll() {
  const grid = document.getElementById('projectGrid');
  grid.innerHTML = '';

  projects.forEach((p, idx) => {
    const box = document.createElement('div');
    box.className = 'project-box' + (editMode ? ' editing' : '');
    box.style.setProperty('--accent', p.color);
    box.dataset.id = p.id;
    box.style.animation = `fadeUp 0.35s ease ${idx * 0.055}s both`;

    const scHTML = p.shortcuts.map(s => `
      <a class="shortcut" href="${s.url}" target="_blank" onclick="scClick(event)">
        <div class="shortcut-icon">
          ${s.icon}
          <button class="delete-btn" onclick="deleteShortcut(event,${p.id},${s.id})">✕</button>
        </div>
        <span class="shortcut-label">${s.name}</span>
      </a>`).join('');

    const hint = p.shortcuts.length === 0
      ? '<div class="empty-hint">Toque em + para adicionar</div>' : '';

    box.innerHTML = `
      <div class="drag-handle" data-pid="${p.id}">⠿</div>
      <div class="project-header">
        <span class="project-name" onclick="renameProject(${p.id})">${p.name}</span>
        <div class="project-header-right">
          <span class="project-count">${p.shortcuts.length} atalho${p.shortcuts.length!==1?'s':''}</span>
          <button class="delete-project-btn" onclick="deleteProject(${p.id})">✕</button>
        </div>
      </div>
      <div class="shortcuts">
        ${scHTML}${hint}
        <div class="shortcut shortcut-add" onclick="showAddShortcut(${p.id})">
          <div class="shortcut-icon">＋</div>
          <span class="shortcut-label">Adicionar</span>
        </div>
      </div>`;

    // Attach drag to handle
    const handle = box.querySelector('.drag-handle');
    handle.addEventListener('touchstart', dragStart, { passive: false });
    handle.addEventListener('mousedown',  dragStart);

    grid.appendChild(box);
  });
}

// ─── SORT ALPHABETICALLY ──────────────────────────────────
function sortAlpha() {
  projects.sort((a, b) => a.name.localeCompare(b.name, 'pt', { sensitivity:'base' }));
  save();
  renderAll();
  toast('Projetos ordenados de A a Z 🔤');
  const btn = document.getElementById('sortBtn');
  btn.classList.add('sort-flash');
  setTimeout(() => btn.classList.remove('sort-flash'), 1000);
}

// ─── EDIT MODE ────────────────────────────────────────────
function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('editToggle');
  btn.textContent = editMode ? '✅' : '✏️';
  btn.classList.toggle('active', editMode);
  document.body.classList.toggle('editing-mode', editMode);
  renderAll();
  if (editMode) toast('Segure ⠿ e arraste para mover');
}

// ─── DRAG & DROP (touch + mouse) ─────────────────────────
function dragStart(e) {
  if (!editMode) return;
  e.preventDefault();
  e.stopPropagation();

  const handle = e.currentTarget;
  dragSrcId = parseInt(handle.dataset.pid);

  const srcBox = document.querySelector(`.project-box[data-id="${dragSrcId}"]`);
  const rect   = srcBox.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;

  dragOffX = cx - rect.left;
  dragOffY = cy - rect.top;

  // floating clone
  floatEl = srcBox.cloneNode(true);
  floatEl.classList.add('drag-floating');
  floatEl.classList.remove('editing');
  floatEl.style.width  = rect.width  + 'px';
  floatEl.style.height = rect.height + 'px';
  floatEl.style.left   = rect.left   + 'px';
  floatEl.style.top    = rect.top    + 'px';
  document.body.appendChild(floatEl);

  srcBox.classList.add('is-dragging-src');

  document.addEventListener('touchmove', dragMove, { passive: false });
  document.addEventListener('touchend',  dragEnd);
  document.addEventListener('mousemove', dragMove);
  document.addEventListener('mouseup',   dragEnd);
}

function dragMove(e) {
  if (!floatEl) return;
  e.preventDefault();

  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;

  floatEl.style.left = (cx - dragOffX) + 'px';
  floatEl.style.top  = (cy - dragOffY) + 'px';

  // detect target box
  floatEl.style.display = 'none';
  const el = document.elementFromPoint(cx, cy);
  floatEl.style.display = '';

  const targetBox = el ? el.closest('.project-box') : null;
  const targetId  = targetBox ? parseInt(targetBox.dataset.id) : null;

  // update highlight
  document.querySelectorAll('.project-box').forEach(b => b.classList.remove('is-drag-over'));
  if (targetId && targetId !== dragSrcId) {
    targetBox.classList.add('is-drag-over');
    overProjId = targetId;
  } else {
    overProjId = null;
  }
}

function dragEnd() {
  document.removeEventListener('touchmove', dragMove);
  document.removeEventListener('touchend',  dragEnd);
  document.removeEventListener('mousemove', dragMove);
  document.removeEventListener('mouseup',   dragEnd);

  if (floatEl) { floatEl.remove(); floatEl = null; }

  document.querySelectorAll('.project-box').forEach(b =>
    b.classList.remove('is-dragging-src', 'is-drag-over'));

  if (overProjId && overProjId !== dragSrcId) {
    const si = projects.findIndex(p => p.id === dragSrcId);
    const di = projects.findIndex(p => p.id === overProjId);
    if (si !== -1 && di !== -1) {
      [projects[si], projects[di]] = [projects[di], projects[si]];
      save();
    }
  }

  dragSrcId = null;
  overProjId = null;
  renderAll();
}

// ─── SHORTCUTS ────────────────────────────────────────────
function scClick(e) { if (editMode) e.preventDefault(); }

function showAddShortcut(projId) {
  currentProjId = projId;
  document.getElementById('scName').value = '';
  document.getElementById('scUrl').value  = '';
  selectedEmoji = '🔗';
  renderEmojiPicker();
  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalBackdrop'))
    document.getElementById('modalBackdrop').classList.remove('open');
}

function renderEmojiPicker() {
  document.getElementById('emojiPicker').innerHTML = EMOJIS.map(em =>
    `<div class="emoji-opt${em===selectedEmoji?' selected':''}" onclick="pickEmoji('${em}')">${em}</div>`
  ).join('');
}

function pickEmoji(em) { selectedEmoji = em; renderEmojiPicker(); }

function saveShortcut() {
  const name = document.getElementById('scName').value.trim();
  const url  = document.getElementById('scUrl').value.trim();
  if (!name || !url) { toast('⚠️ Preencha nome e URL'); return; }
  const proj = projects.find(p => p.id === currentProjId);
  if (!proj) return;
  proj.shortcuts.push({ id: nextId++, name, url, icon: selectedEmoji });
  save(); closeModal(); renderAll();
}

function deleteShortcut(e, projId, scId) {
  e.preventDefault(); e.stopPropagation();
  const proj = projects.find(p => p.id === projId);
  if (!proj) return;
  proj.shortcuts = proj.shortcuts.filter(s => s.id !== scId);
  save(); renderAll();
}

// ─── PROJECTS ─────────────────────────────────────────────
function showAddProject() {
  document.getElementById('projName').value = '';
  document.getElementById('projModalBackdrop').classList.add('open');
}

function closeProjModal(e) {
  if (!e || e.target === document.getElementById('projModalBackdrop'))
    document.getElementById('projModalBackdrop').classList.remove('open');
}

function saveProject() {
  const name = document.getElementById('projName').value.trim();
  if (!name) { toast('⚠️ Digite um nome'); return; }
  const color = ACCENTS[projects.length % ACCENTS.length];
  projects.push({ id: nextId++, name, color, shortcuts: [] });
  save(); closeProjModal(); renderAll();
}

function deleteProject(projId) {
  if (!confirm('Excluir este projeto e todos os atalhos?')) return;
  projects = projects.filter(p => p.id !== projId);
  save(); renderAll();
}

function renameProject(projId) {
  const proj = projects.find(p => p.id === projId);
  if (!proj) return;
  const n = prompt('Novo nome:', proj.name);
  if (n && n.trim()) { proj.name = n.trim(); save(); renderAll(); }
}

// ─── TOAST ────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ─── INIT ─────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
